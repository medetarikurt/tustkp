<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tus takip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #091312;
  --card-bg: #0d1a18;
  --border: #182c28;
  --border-focus: #2d4f48;
  --text-main: #e2e8f0;
  --text-dim: #5c7570;
  --gold: #d4a359;
  --gold-glow: rgba(212, 163, 89, 0.15);
  --success: #10b981;
  --success-glow: rgba(16, 185, 129, 0.15);
  --radius: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 14px 40px;
}

.wrap {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Header */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  letter-spacing: 0.05em;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-weight: 500;
}

.brand svg {
  width: 16px;
  height: 16px;
  stroke: var(--gold);
}

.countdown {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--gold);
}

.countdown span {
  color: var(--gold);
  font-size: 1.05rem;
}

.sync-status {
  font-size: 0.7rem;
  color: var(--text-dim);
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
}

/* Gün Seçici Carousel */
.week-selector {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin: 4px 0 6px;
}

.nav-arrow {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.days-list {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}

.days-list::-webkit-scrollbar { display: none; }

.day-item {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.78rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.day-item.active {
  border-color: var(--gold);
  color: #fff;
  box-shadow: 0 0 0 1px var(--gold);
}

/* Başlık Alanı */
.day-header {
  text-align: center;
  margin: 6px 0 10px;
}

.day-title {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}

.day-subtitle {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-weight: 400;
}

/* Form Alanları */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-label {
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.input-text {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-main);
  padding: 14px 16px;
  font-size: 0.95rem;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
}

.input-text:focus {
  border-color: var(--border-focus);
}

textarea.input-text {
  min-height: 180px;
  resize: vertical;
  line-height: 1.6;
}

/* Soru Çözüm Butonu */
.q-btn {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 16px;
  color: var(--text-dim);
  font-family: 'Inter', sans-serif;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.q-btn.completed {
  border-color: var(--success);
  color: var(--success);
  background: var(--success-glow);
}

.sub-note {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: -2px;
}

/* Alt Navigasyon */
.bottom-nav {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  margin-top: 6px;
}

.nav-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.nav-btn.today-btn {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-glow);
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 3"></path>
      </svg>
      TUS · 14 MART 2027
    </div>
    <div>
      <div class="countdown"><span id="daysLeft">--</span> gün kaldı</div>
      <div class="sync-status" id="syncStatus">Bulut: Senkronize</div>
    </div>
  </div>

  <!-- Gün Carousel -->
  <div class="week-selector">
    <button class="nav-arrow" onclick="shiftDays(-1)">&#8249;</button>
    <div class="days-list" id="daysList"></div>
    <button class="nav-arrow" onclick="shiftDays(1)">&#8250;</button>
  </div>

  <!-- Gün Başlığı -->
  <div class="day-header">
    <div class="day-title" id="displayDayName">--</div>
    <div class="day-subtitle" id="displayFullDate">-- · plan henüz başlamadı</div>
  </div>

  <!-- Ders Girişi -->
  <div class="field-group">
    <div class="field-label">DERS</div>
    <input type="text" id="courseInput" class="input-text" placeholder="Ders adı" oninput="saveCurrentData()">
  </div>

  <!-- Yapılacaklar -->
  <div class="field-group">
    <div class="field-label">NELER YAPACAKSIN</div>
    <textarea id="todoInput" class="input-text" placeholder="Bugün yapılacaklar..." oninput="saveCurrentData()"></textarea>
  </div>

  <!-- Soru Butonu -->
  <div class="field-group">
    <div class="field-label">100 SORU HEDEFİ</div>
    <button class="q-btn" id="qBtn" onclick="toggleQuestions()">
      100 SORU ÇÖZDÜM
    </button>
    <div class="sub-note">Bir dokunuşla tamamlandı olarak işaretlenir</div>
  </div>

  <!-- Alt Butonlar -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navigateDay(-1)">&#8249; Dün</button>
    <button class="nav-btn today-btn" onclick="goToToday()">&#8635; Bugün</button>
    <button class="nav-btn" onclick="navigateDay(1)">Yarın &#8250;</button>
  </div>
</div>

<script>
// Firebase Veritabanı URL'in
const FIREBASE_URL = "https://tustkp-default-rtdb.europe-west1.firebasedatabase.app/";

const TARGET_DATE = new Date('2027-03-14T00:00:00');
const PROGRAM_START_DATE = new Date('2026-08-26T00:00:00');
const DAY_NAMES = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const FULL_DAY_NAMES = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const MONTH_NAMES = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

let currentDate = new Date();
let carouselStartDate = new Date(currentDate);
let saveTimeout = null;

function init() {
  updateCountdown();
  carouselStartDate.setDate(currentDate.getDate() - 1);
  renderCarousel();
  loadDateData(currentDate);
}

function updateCountdown() {
  const now = new Date();
  const diffTime = TARGET_DATE - now;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  document.getElementById('daysLeft').innerText = diffDays > 0 ? diffDays : 0;
}

function formatDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderCarousel() {
  const list = document.getElementById('daysList');
  list.innerHTML = '';
  
  for (let i = 0; i < 7; i++) {
    const d = new Date(carouselStartDate);
    d.setDate(carouselStartDate.getDate() + i);
    
    const btn = document.createElement('button');
    btn.className = `day-item ${formatDateKey(d) === formatDateKey(currentDate) ? 'active' : ''}`;
    btn.innerText = DAY_NAMES[d.getDay()];
    btn.onclick = () => selectDate(d);
    list.appendChild(btn);
  }
}

function shiftDays(delta) {
  carouselStartDate.setDate(carouselStartDate.getDate() + delta);
  renderCarousel();
}

function selectDate(d) {
  currentDate = new Date(d);
  renderCarousel();
  loadDateData(currentDate);
}

function navigateDay(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  carouselStartDate.setDate(currentDate.getDate() - 1);
  renderCarousel();
  loadDateData(currentDate);
}

function goToToday() {
  currentDate = new Date();
  carouselStartDate = new Date(currentDate);
  carouselStartDate.setDate(currentDate.getDate() - 1);
  renderCarousel();
  loadDateData(currentDate);
}

async function loadDateData(d) {
  const key = formatDateKey(d);
  document.getElementById('syncStatus').innerText = "Bulut: Yükleniyor...";
  
  let data = { course: '', todo: '', qDone: false };

  const localRaw = localStorage.getItem(`tus_plan_${key}`);
  if (localRaw) data = JSON.parse(localRaw);

  if (FIREBASE_URL) {
    try {
      const res = await fetch(`${FIREBASE_URL}plans/${key}.json`);
      if (res.ok) {
        const cloudData = await res.json();
        if (cloudData) {
          data = cloudData;
          localStorage.setItem(`tus_plan_${key}`, JSON.stringify(data));
        }
      }
      document.getElementById('syncStatus').innerText = "Bulut: Senkronize";
    } catch (e) {
      document.getElementById('syncStatus').innerText = "Bulut: Çevrimdışı";
    }
  }

  document.getElementById('displayDayName').innerText = FULL_DAY_NAMES[d.getDay()];
  
  let statusText = 'plan henüz başlamadı';
  if (d < PROGRAM_START_DATE && !data.course && !data.todo) {
    statusText = 'program öncesi gün';
  } else if (data.course || data.todo || data.qDone) {
    statusText = 'plan kayıtlı';
  }

  document.getElementById('displayFullDate').innerText = `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()} · ${statusText}`;

  document.getElementById('courseInput').value = data.course || '';
  document.getElementById('todoInput').value = data.todo || '';

  const btn = document.getElementById('qBtn');
  if (data.qDone) {
    btn.classList.add('completed');
    btn.innerText = '✓ 100 SORU ÇÖZÜLDÜ (TAMAMLANDI)';
  } else {
    btn.classList.remove('completed');
    btn.innerText = '100 SORU ÇÖZDÜM (DOKUN VE TAMAMLANIŞI İŞARETLE)';
  }
}

function saveCurrentData() {
  const key = formatDateKey(currentDate);
  const data = {
    course: document.getElementById('courseInput').value,
    todo: document.getElementById('todoInput').value,
    qDone: document.getElementById('qBtn').classList.contains('completed')
  };
  
  localStorage.setItem(`tus_plan_${key}`, JSON.stringify(data));
  
  let statusText = data.course || data.todo || data.qDone ? 'plan kayıtlı' : 'plan henüz başlamadı';
  document.getElementById('displayFullDate').innerText = `${currentDate.getDate()} ${MONTH_NAMES[currentDate.getMonth()]} ${currentDate.getFullYear()} · ${statusText}`;

  if (FIREBASE_URL) {
    document.getElementById('syncStatus').innerText = "Bulut: Kaydediliyor...";
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
      try {
        await fetch(`${FIREBASE_URL}plans/${key}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        document.getElementById('syncStatus').innerText = "Bulut: Senkronize";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "Bulut: Hata!";
      }
    }, 1000);
  }
}

function toggleQuestions() {
  const btn = document.getElementById('qBtn');
  btn.classList.toggle('completed');
  
  if (btn.classList.contains('completed')) {
    btn.innerText = '✓ 100 SORU ÇÖZÜLDÜ (TAMAMLANDI)';
  } else {
    btn.innerText = '100 SORU ÇÖZDÜM (DOKUN VE TAMAMLANIŞI İŞARETLE)';
  }
  
  saveCurrentData();
}

init();
</script>
</body>
</html>
