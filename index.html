<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TUS Takip - Sarmal Sistem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #091312;
  --card-bg: #0d1a18;
  --border: #182c28;
  --border-focus: #2d4f48;
  --text-main: #e2e8f0;
  --text-dim: #5c7570;
  --gold: #d4a359;
  --gold-glow: rgba(212, 163, 89, 0.15);
  --success: #10b981;
  --success-glow: rgba(16, 185, 129, 0.15);
  --shift-accent: #3b82f6;
  --night-bg: #141124;
  --night-border: #302654;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
input, textarea { user-select: text; }

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 14px 40px;
  transition: background-color 0.15s;
}

body.shift-mode { background-color: #060b11; }

.wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-weight: 500; }
.brand svg { width: 16px; height: 16px; stroke: var(--gold); }
.countdown { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--gold); }
.countdown span { font-size: 1.05rem; }

/* Stats */
.meta-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center;
}
.stat-box .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--gold); font-size: 0.95rem; }
.stat-box .l { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

/* Carousel */
.week-selector { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.nav-arrow { background: transparent; border: 1px solid var(--border); color: var(--text-dim); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
.days-list { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.days-list::-webkit-scrollbar { display: none; }
.day-item { min-width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 0.72rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.day-item span.num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.88rem; }
.day-item.active { border-color: var(--gold); color: #fff; background: rgba(212, 163, 89, 0.15); box-shadow: 0 0 0 1px var(--gold); }
.day-item.is-shift { border-color: var(--shift-accent); color: var(--shift-accent); }

/* Day Header */
.day-header { text-align: center; margin: 4px 0; }
.day-title { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 700; color: #fff; }
.day-subtitle { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
.shift-toggle-btn { margin: 8px auto 0; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 190px; }
body.shift-mode .shift-toggle-btn { border-color: var(--shift-accent); color: var(--shift-accent); background: rgba(59, 130, 246, 0.15); }

/* Dynamic Plan Cards */
.plan-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.plan-card.night { background: var(--night-bg); border-color: var(--night-border); }
.plan-card.special { background: var(--gold-glow); border-color: var(--gold); text-align: center; }
.card-label { font-size: 0.68rem; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.plan-card.night .card-label { color: #a78bfa; }
.subject-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
.resource-text { font-size: 0.85rem; color: var(--gold); display: flex; align-items: center; gap: 6px; }

/* Trial Inputs */
.trial-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.trial-field label { font-size: 0.7rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
.trial-field input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #fff; font-family: 'JetBrains Mono', monospace; text-align: center; }

/* Todo */
.input-text { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-main); padding: 12px 14px; font-size: 0.92rem; outline: none; font-family: inherit; resize: vertical; min-height: 80px; }

/* Action Buttons */
.q-btn { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; color: var(--text-dim); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.q-btn.completed { border-color: var(--success); color: var(--success); background: var(--success-glow); }

/* Bottom Nav */
.bottom-nav { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; margin-top: 10px; }
.nav-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.nav-btn.today-btn { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg> 14 MART 2027</div>
    <div class="countdown"><span id="daysLeft">--</span> gün kaldı</div>
  </div>

  <div class="meta-stats">
    <div class="stat-box"><div class="v" id="effVal">0</div><div class="l">Net Gün</div></div>
    <div class="stat-box"><div class="v" id="totalQVal">0</div><div class="l">Toplam Soru</div></div>
    <div class="stat-box"><div class="v" id="syncVal">...</div><div class="l">Senkron</div></div>
  </div>

  <div class="week-selector">
    <button class="nav-arrow" onclick="shiftDays(-1)">&#8249;</button>
    <div class="days-list" id="daysList"></div>
    <button class="nav-arrow" onclick="shiftDays(1)">&#8250;</button>
  </div>

  <div class="day-header">
    <div class="day-title" id="displayDayName">--</div>
    <div class="day-subtitle" id="displayFullDate">--</div>
    <button class="shift-toggle-btn" id="shiftBtn" onclick="toggleShiftMode()">
      <span>🏥</span> <span id="shiftBtnText">Nöbet (0.5 Gün) İşaretle</span>
    </button>
  </div>

  <!-- Dynamic Content Area -->
  <div id="dynamicContent"></div>

  <!-- Yapılacaklar -->
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div class="card-label" style="color:var(--text-dim);">GÜNLÜK NOTLAR</div>
    <textarea id="todoInput" class="input-text" placeholder="Ekstra yapılacaklar..." oninput="saveCurrentData()"></textarea>
  </div>

  <!-- Nav -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navigateDay(-1)">&#8249; Dün</button>
    <button class="nav-btn today-btn" onclick="goToToday()">&#8635; Bugün</button>
    <button class="nav-btn" onclick="navigateDay(1)">Yarın &#8250;</button>
  </div>
</div>

<script>
const FIREBASE_URL = "https://tustkp-default-rtdb.europe-west1.firebasedatabase.app/";
const TARGET_DATE = new Date('2027-03-14T00:00:00');
const START_DATE = new Date('2026-09-01T00:00:00'); 
const CAMP_START = new Date('2027-02-22T00:00:00');
const EXAM_WEEK = new Date('2027-03-08T00:00:00');

const ORDER = ['Patoloji', 'Dahiliye', 'Biyokimya', 'Pediatri', 'Farmakoloji', 'Genel Cerrahi', 'Anatomi', 'Küçük Stajlar', 'Fizyoloji', 'Kadın Doğum', 'Mikrobiyoloji'];
const DAY_NAMES = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const FULL_DAY_NAMES = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const MONTH_NAMES = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

// Schedule Generator (146 Working Days)
let scheduleSequence = [];
[4,6,4,6,4,3,4,3,4,3,4].forEach((d, i) => { for(let k=0;k<d;k++) scheduleSequence.push({r:1, s:ORDER[i], idx:i}); });
[3,4,3,4,3,3,3,3,3,3,3].forEach((d, i) => { for(let k=0;k<d;k++) scheduleSequence.push({r:2, s:ORDER[i], idx:i}); });
for(let r=3; r<=4; r++) { [3,3,3,3,3,3,3,3,3,3,3].forEach((d, i) => { for(let k=0;k<d;k++) scheduleSequence.push({r, s:ORDER[i], idx:i}); }); }

let currentDate = new Date();
let carouselStartDate = new Date();
let saveTimeout = null;
let currentDayData = { isShift: false, netTemel: '', netKlinik: '', qDoneDay: false, qDoneNight: false, todo: '' };

function init() {
  updateCountdown();
  carouselStartDate = new Date(currentDate);
  carouselStartDate.setDate(currentDate.getDate() - 1);
  renderCarousel();
  loadDateData(currentDate);
  calculateGlobalStats();
}

function updateCountdown() {
  const diffDays = Math.ceil((TARGET_DATE - new Date()) / (1000 * 60 * 60 * 24));
  document.getElementById('daysLeft').innerText = diffDays > 0 ? diffDays : 0;
}

function formatDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getResource(subj, round) {
  if(subj === 'Anatomi') return 'SMT Konu';
  if(subj === 'Fizyoloji') return 'Deneme / Çıkmış Sorular';
  if(['Pediatri', 'Genel Cerrahi'].includes(subj)) return round <= 2 ? 'Ahmet Erkek SB' : 'Vaka SB';
  if(subj === 'Dahiliye') return round <= 2 ? 'Tıp Ak SB' : 'Vaka SB';
  if(subj === 'Küçük Stajlar') return round === 1 ? 'Prime' : (round === 2 ? 'İrşadi' : 'Vaka SB');
  if(subj === 'Kadın Doğum') return round <= 2 ? 'Deneme Soruları' : 'Vaka SB';
  if(subj === 'Mikrobiyoloji') return round <= 2 ? 'Tıp Ak SB' : 'Vaka SB';
  if(['Biyokimya', 'Farmakoloji'].includes(subj)) return round <= 2 ? 'Tıp Ak SB' : 'Prime';
  if(subj === 'Patoloji') return round <= 2 ? 'SST (Emrah Hoca)' : 'Prime';
  return '';
}

function getPlanForDate(targetObj) {
  if (targetObj < START_DATE) return { type: 'OFF', msg: 'Program Başlamadı' };
  if (targetObj > TARGET_DATE) return { type: 'OFF', msg: 'Sınav Bitti' };
  
  const isSunday = targetObj.getDay() === 0;
  if (isSunday) return { type: 'DENEME' };
  if (targetObj >= EXAM_WEEK) return { type: 'EXAM_WEEK' };
  if (targetObj >= CAMP_START) return { type: 'CAMP' };

  let workingDaysElapsed = 0;
  let tempDate = new Date(START_DATE);
  while (tempDate < targetObj) {
    if (tempDate.getDay() !== 0) workingDaysElapsed++;
    tempDate.setDate(tempDate.getDate() + 1);
  }

  if (workingDaysElapsed < scheduleSequence.length) {
    const todayBlock = scheduleSequence[workingDaysElapsed];
    const prevIdx = todayBlock.idx === 0 ? ORDER.length - 1 : todayBlock.idx - 1;
    return {
      type: 'SPIRAL',
      round: todayBlock.r,
      daySubj: todayBlock.s,
      dayRes: getResource(todayBlock.s, todayBlock.r),
      nightSubj: ORDER[prevIdx] === 'Patoloji' ? 'Patoloji (Akşam da)' : ORDER[prevIdx]
    };
  } else {
    return { type: 'BUFFER', msg: 'Serbest Tekrar / Eksik Kapatma' };
  }
}

function renderCarousel() {
  const list = document.getElementById('daysList');
  list.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(carouselStartDate);
    d.setDate(carouselStartDate.getDate() + i);
    const key = formatDateKey(d);
    const raw = localStorage.getItem(`tus_plan_${key}`);
    const data = raw ? JSON.parse(raw) : {};

    const btn = document.createElement('button');
    btn.className = `day-item ${key === formatDateKey(currentDate) ? 'active' : ''} ${data.isShift ? 'is-shift' : ''}`;
    btn.innerHTML = `<span class="num">${d.getDate()}</span><span>${DAY_NAMES[d.getDay()]}</span>`;
    btn.onclick = () => { currentDate = new Date(d); renderCarousel(); loadDateData(currentDate); };
    list.appendChild(btn);
  }
}

function shiftDays(delta) { carouselStartDate.setDate(carouselStartDate.getDate() + delta); renderCarousel(); }
function navigateDay(delta) { currentDate.setDate(currentDate.getDate() + delta); carouselStartDate.setDate(currentDate.getDate() - 1); renderCarousel(); loadDateData(currentDate); }
function goToToday() { currentDate = new Date(); carouselStartDate = new Date(currentDate); carouselStartDate.setDate(currentDate.getDate() - 1); renderCarousel(); loadDateData(currentDate); }

async function loadDateData(d) {
  const key = formatDateKey(d);
  document.getElementById('syncVal').innerText = "...";
  
  currentDayData = { isShift: false, netTemel: '', netKlinik: '', qDoneDay: false, qDoneNight: false, todo: '' };
  const localRaw = localStorage.getItem(`tus_plan_${key}`);
  if (localRaw) currentDayData = JSON.parse(localRaw);

  try {
    const res = await fetch(`${FIREBASE_URL}plans/${key}.json`);
    if (res.ok) {
      const cloudData = await res.json();
      if (cloudData) { currentDayData = cloudData; localStorage.setItem(`tus_plan_${key}`, JSON.stringify(currentDayData)); }
    }
    document.getElementById('syncVal').innerText = "OK";
  } catch (e) {
    document.getElementById('syncVal').innerText = "OFF";
  }
  buildUI(d);
}

function buildUI(d) {
  document.getElementById('displayDayName').innerText = FULL_DAY_NAMES[d.getDay()];
  document.getElementById('displayFullDate').innerText = `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById('todoInput').value = currentDayData.todo || '';

  const sBtn = document.getElementById('shiftBtn');
  const sText = document.getElementById('shiftBtnText');
  if (currentDayData.isShift) {
    document.body.classList.add('shift-mode');
    sText.innerText = "Nöbet (0.5 Gün) Aktif";
  } else {
    document.body.classList.remove('shift-mode');
    sText.innerText = "Nöbet (0.5 Gün) İşaretle";
  }

  const content = document.getElementById('dynamicContent');
  const plan = getPlanForDate(d);
  
  let html = '';
  if (plan.type === 'OFF' || plan.type === 'BUFFER') {
    html = `<div class="plan-card special"><div class="subject-title">${plan.msg}</div></div>`;
  } 
  else if (plan.type === 'EXAM_WEEK') {
    html = `<div class="plan-card special" style="border-color:var(--success);"><div class="subject-title">🔥 SINAV HAFTASI</div><div class="resource-text" style="justify-content:center;">Son tekrarlar ve denemeler</div></div>`;
  }
  else if (plan.type === 'CAMP') {
    html = `
      <div class="plan-card special">
        <div class="subject-title">🚀 14 GÜNLÜK SORU KAMPI</div>
      </div>
      <button class="q-btn ${currentDayData.qDoneDay ? 'completed' : ''}" onclick="toggleQ('day')" style="margin-top:10px;">
        ${currentDayData.qDoneDay ? '✓ KAMP SORULARI ÇÖZÜLDÜ' : 'KAMP SORULARINI ÇÖZDÜM'}
      </button>
    `;
  }
  else if (plan.type === 'DENEME') {
    html = `
      <div class="plan-card special">
        <div class="subject-title">📊 200 SORULUK TUS DENEMESİ</div>
        <div class="trial-inputs">
          <div class="trial-field"><label>Temel Net (100)</label><input type="number" id="inpTemel" value="${currentDayData.netTemel}" oninput="updateNet('temel', this.value)"></div>
          <div class="trial-field"><label>Klinik Net (100)</label><input type="number" id="inpKlinik" value="${currentDayData.netKlinik}" oninput="updateNet('klinik', this.value)"></div>
        </div>
      </div>
    `;
  }
  else if (plan.type === 'SPIRAL') {
    html = `
      <div class="plan-card">
        <div class="card-label">☀️ GÜNDÜZ (${plan.round}. TEKRAR)</div>
        <div class="subject-title">${plan.daySubj}</div>
        <div class="resource-text">📖 Kaynak: ${plan.dayRes}</div>
        <button class="q-btn ${currentDayData.qDoneDay ? 'completed' : ''}" onclick="toggleQ('day')" style="margin-top:8px;">
          ${currentDayData.qDoneDay ? '✓ GÜNDÜZ HEDEFİ TAMAM' : 'GÜNDÜZ HEDEFİNİ TAMAMLADIM'}
        </button>
      </div>
      <div class="plan-card night">
        <div class="card-label">🌙 AKŞAM (SARMAL SORU)</div>
        <div class="subject-title">${plan.nightSubj}</div>
        <div class="resource-text" style="color:#a78bfa;">🎯 Min. 100 Soru Çözümü</div>
        <button class="q-btn ${currentDayData.qDoneNight ? 'completed' : ''}" onclick="toggleQ('night')" style="margin-top:8px;">
          ${currentDayData.qDoneNight ? '✓ AKŞAM SORULARI ÇÖZÜLDÜ' : '100 SORUYU ÇÖZDÜM'}
        </button>
      </div>
    `;
  }

  content.innerHTML = html;
}

window.toggleQ = function(period) {
  if (period === 'day') currentDayData.qDoneDay = !currentDayData.qDoneDay;
  if (period === 'night') currentDayData.qDoneNight = !currentDayData.qDoneNight;
  saveCurrentData();
  buildUI(currentDate);
};

window.updateNet = function(type, val) {
  if(type === 'temel') currentDayData.netTemel = val;
  if(type === 'klinik') currentDayData.netKlinik = val;
  saveCurrentData();
};

window.toggleShiftMode = function() {
  currentDayData.isShift = !currentDayData.isShift;
  saveCurrentData();
  buildUI(currentDate);
};

window.saveCurrentData = function() {
  const key = formatDateKey(currentDate);
  currentDayData.todo = document.getElementById('todoInput') ? document.getElementById('todoInput').value : currentDayData.todo;
  
  localStorage.setItem(`tus_plan_${key}`, JSON.stringify(currentDayData));
  renderCarousel();
  calculateGlobalStats();

  document.getElementById('syncVal').innerText = "...";
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await fetch(`${FIREBASE_URL}plans/${key}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentDayData) });
      document.getElementById('syncVal').innerText = "OK";
    } catch (e) {
      document.getElementById('syncVal').innerText = "ERR";
    }
  }, 600);
};

function calculateGlobalStats() {
  let effectiveDays = 0;
  let totalQ = 0;
  
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('tus_plan_')) {
      const d = JSON.parse(localStorage.getItem(k));
      let points = 0;
      if (d.qDoneDay) points += 0.5;
      if (d.qDoneNight) points += 0.5;
      if (d.qDoneNight) totalQ += 100; // Akşam 100 soru
      
      // Nöbet günüyse çalışılan miktar efektif olarak max 0.5 yansır
      if (d.isShift && points > 0) effectiveDays += 0.5;
      else effectiveDays += points;
    }
  }
  document.getElementById('effVal').innerText = effectiveDays.toFixed(1);
  document.getElementById('totalQVal').innerText = totalQ.toLocaleString();
}

init();
</script>
</body>
</html>
