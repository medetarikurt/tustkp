<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Takip & Sarmal Analiz</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc; 
            --primary-variant: #3700b3; --secondary: #03dac6; 
            --text: #e0e0e0; --text-muted: #a0a0a0; 
            --success: #4caf50; --border: #333333; --warning: #ff9800;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 15px; }
        .container { background-color: var(--surface); padding: 20px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); position: relative; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 15px; font-size: 22px; font-weight: 700; }
        
        /* Sekmeler */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; background: transparent; color: var(--text-muted); border: none; padding: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* 3'lü Yuvarlak Takvim Navigasyonu */
        .takvim-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .nav-ok { background: transparent; color: var(--text-muted); border: none; font-size: 24px; cursor: pointer; padding: 5px 15px; transition: 0.2s; }
        .nav-ok:hover { color: #fff; }
        
        .yuvarlaklar { display: flex; gap: 12px; align-items: center; }
        .yuvarlak { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #2c2c2c; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text-muted); transition: 0.3s; }
        .yuvarlak:hover { background: #3d3d3d; }
        .yuvarlak.aktif { background: var(--primary); color: #000; transform: scale(1.1); box-shadow: 0 0 10px rgba(187, 134, 252, 0.4); }

        .tarih-alt-yazi { text-align: center; color: var(--secondary); font-size: 13px; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Hedef Kartı */
        .hedef-karti { background: #262626; border-left: 4px solid var(--secondary); padding: 16px; border-radius: 8px; margin-bottom: 15px; }
        .tatil-karti { border-left-color: var(--warning); display: none; }
        
        .hedef-baslik { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .hedef-baslik h2 { font-size: 18px; color: #fff; }
        .badge { background: var(--primary-variant); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        
        .gorev-item { margin-bottom: 12px; background: #303030; padding: 12px; border-radius: 8px; }
        .gorev-item strong { display: block; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; }
        .sayfa-bilgisi { font-size: 14px; margin-bottom: 10px; color: #fff; }
        
        .checkbox-container { display: flex; align-items: center; cursor: pointer; user-select: none; font-size: 14px; color: #ccc; }
        .checkbox-container input { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
        
        /* Açılır Branş Modülü */
        .btn-acilir { width: 100%; background: #333; color: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .btn-acilir:hover { background: #444; }
        
        .brans-modulu-icerik { display: none; background: #262626; padding: 15px; border-radius: 8px; margin-top: 8px; border-left: 3px solid var(--primary); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #303030; color: #fff; outline: none; }
        .btn-kaydet { width: 100%; background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* İstatistik Ekranı */
        .istatistik-kutu { background: #262626; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border-bottom: 3px solid var(--primary); }
        .istatistik-deger { font-size: 24px; font-weight: bold; color: var(--primary); margin: 5px 0; }
        .istatistik-baslik { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .analiz-tablo { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .analiz-tablo th { background: #333; color: var(--secondary); padding: 10px; text-align: left; font-size: 13px; }
        .analiz-tablo td { padding: 10px; border-bottom: 1px solid var(--border); color: #e0e0e0; font-size: 14px; }

        /* Kaydırma Çubuğu (Bitenler Listesi İçin) */
        .scroll-liste::-webkit-scrollbar { width: 6px; }
        .scroll-liste::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .scroll-liste::-webkit-scrollbar-track { background: #222; }

        /* Toast Mesaj */
        #toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

<div class="container">
    <div id="toast">✅ Kaydedildi</div>
    <h1>TUS Sarmal Takip</h1>
    
    <div class="tabs">
        <button class="tab-btn active" id="tab-plan-btn" onclick="sekmeDegistir('plan')">Çalışma Planı</button>
        <button class="tab-btn" id="tab-ist-btn" onclick="sekmeDegistir('istatistik')">İstatistik & Analiz</button>
    </div>

    <!-- SEKME 1: ÇALIŞMA PLANI -->
    <div id="sekme-plan">
        <div class="takvim-nav">
            <button class="nav-ok" onclick="tarihDegistir(-1)">❮</button>
            <div class="yuvarlaklar">
                <div class="yuvarlak" id="y-dunku" onclick="tarihDegistir(-1)">-</div>
                <div class="yuvarlak aktif" id="y-bugunku">-</div>
                <div class="yuvarlak" id="y-yarin" onclick="tarihDegistir(1)">-</div>
            </div>
            <button class="nav-ok" onclick="tarihDegistir(1)">❯</button>
        </div>
        <div class="tarih-alt-yazi" id="tarih-metni">Tarih Hesaplanıyor...</div>

        <div id="aktif-ders-karti" class="hedef-karti">
            <div class="hedef-baslik">
                <h2 id="kart-ders-adi">Yükleniyor</h2>
                <span id="kart-tur-gun" class="badge">...</span>
            </div>

            <div class="gorev-item" id="konu-modulu">
                <strong style="color: var(--primary);">📖 <span id="konu-ders-isim">Ders</span> Konusu</strong>
                <div id="konu-sayfa" class="sayfa-bilgisi">...</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="konu-check" onchange="firebaseKaydet()"> Hedefi Tamamladım
                </label>
            </div>

            <div class="gorev-item" id="soru-modulu">
                <strong style="color: var(--secondary);">🎯 <span id="soru-ders-isim">Ders</span> Sorusu</strong>
                <div id="soru-sayfa" class="sayfa-bilgisi">...</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="soru-check" onchange="firebaseKaydet()"> Hedefi Tamamladım
                </label>
            </div>
            
            <div class="gorev-item" id="deneme-modulu" style="display: none; border-left: 3px solid #ff9800;">
                <strong id="deneme-baslik" style="color: var(--warning);">🔥 Deneme Modülü</strong>
                <label class="checkbox-container" style="margin-bottom: 8px;">
                    <input type="checkbox" id="temel-check" onchange="firebaseKaydet()"> 1 Temel Bilimler (100 S)
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="klinik-check" onchange="firebaseKaydet()"> 1 Klinik Bilimler (100 S)
                </label>
            </div>
        </div>

        <div id="tatil-karti" class="hedef-karti tatil-karti">
            <h2 style="color: var(--warning); text-align: center; margin-bottom: 10px;">🌴 Mola / Opsiyon Günü</h2>
            <p style="text-align: center; font-size: 14px; color: var(--text-muted);">Sarmal takvim bugün ilerlemez.</p>
        </div>

        <!-- BRANŞ DENEMESİ EKLE -->
        <button class="btn-acilir" onclick="bransModuluGoster()">
            <span>➕ Branş Denemesi Gir</span>
            <span id="brans-ok">▼</span>
        </button>
        <div id="brans-icerik" class="brans-modulu-icerik">
            <div class="form-group">
                <label>Ders Seç</label>
                <select id="brans-ders">
                    <option value="Dahiliye">Dahiliye</option>
                    <option value="Fizyoloji">Fizyoloji</option>
                    <option value="Patoloji">Patoloji</option>
                    <option value="Biyokimya">Biyokimya</option>
                    <option value="Pediatri">Pediatri</option>
                    <option value="Mikrobiyoloji">Mikrobiyoloji</option>
                    <option value="Farmakoloji">Farmakoloji</option>
                    <option value="Anatomi">Anatomi</option>
                    <option value="Küçük Stajlar">Küçük Stajlar</option>
                    <option value="Genel Cerrahi">Genel Cerrahi</option>
                    <option value="Kadın Doğum">Kadın Doğum</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Doğru</label>
                    <input type="number" id="brans-dogru" min="0" placeholder="Örn: 18">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Yanlış</label>
                    <input type="number" id="brans-yanlis" min="0" placeholder="Örn: 4">
                </div>
            </div>
            <button class="btn-kaydet" onclick="bransDenemeKaydet()">Sonucu İşle</button>
        </div>
    </div>

    <!-- SEKME 2: İSTATİSTİKLER -->
    <div id="sekme-istatistik" style="display: none;">
        
        <div class="istatistik-kutu">
            <div class="istatistik-baslik">Mevcut Durum</div>
            <div class="istatistik-deger" id="ist-mevcut-tur">-</div>
            <div style="font-size: 13px; color: #fff;" id="ist-mevcut-gun">...</div>
        </div>

        <div class="hedef-karti" style="border-left-color: var(--success);">
            <h2 style="font-size: 16px; margin-bottom: 10px; color: #fff;">🏆 Tamamlanan Görevler</h2>
            <div id="ist-tamamlanan-liste" class="scroll-liste" style="max-height: 220px; overflow-y: auto; padding-right: 8px;">
                <!-- JS ile Doldurulacak -->
                <div style="text-align:center; color:#888; font-size:13px; margin-top:10px;">Yükleniyor...</div>
            </div>
        </div>

        <div class="hedef-karti" style="border-left-color: var(--secondary);">
            <h2 style="font-size: 16px; margin-bottom: 10px; color: #fff;">📊 Branş Deneme Karnesi</h2>
            <div id="analiz-icerik" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 15px 0;">
                Yükleniyor...
            </div>
        </div>
    </div>

</div>

<script>
    // FİREBASE BİLGİLERİNİZ
    const firebaseConfig = {
        apiKey: "AIzaSyCaDwYAGYgMHLmO3jypXF_SscN1Lze2EHg",
        authDomain: "tustkp.firebaseapp.com",
        databaseURL: "https://tustkp-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "tustkp",
        storageBucket: "tustkp.firebasestorage.app",
        messagingSenderId: "698391461184",
        appId: "1:698391461184:web:a990d5b57b6d7ad8f7cea5",
        measurementId: "G-K4BTXL7FLB"
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const planData = {
        dahiliye: { isim: "Dahiliye", konu: 450, soru: 750, konuK: "BBB Tıp Ak.", soruK: "Prime" },
        pediatri: { isim: "Pediatri", konu: 200, soru: 450, konuK: "Speet", soruK: "Ahmet Erkek" },
        fizyoloji: { isim: "Fizyoloji", konu: 100, soru: 400, konuK: "Speet", soruK: "Prime" },
        patoloji: { isim: "Patoloji", konu: 100, soru: 450, konuK: "Speet", soruK: "SST" },
        biyokimya: { isim: "Biyokimya", konu: 200, soru: 200, konuK: "Tıp Ak.", soruK: "Tıp Ak." },
        mikrobiyoloji: { isim: "Mikrobiyoloji", konu: 250, soru: 400, konuK: "Tıp Ak.", soruK: "Prime" },
        farmakoloji: { isim: "Farmakoloji", konu: 100, soru: 400, konuK: "Speet", soruK: "Prime" },
        anatomi: { isim: "Anatomi", konu: 100, soru: 0, konuK: "Speet", soruK: "Yok" },
        kucukstajlar: { isim: "Küçük Stajlar", konu: 170, soru: 400, konuK: "Speet", soruK: "Prime" },
        genelcerrahi: { isim: "Genel Cerrahi", konu: 400, soru: 450, konuK: "Ahmet Erkek", soruK: "Ahmet Erkek" },
        kadindogum: { isim: "Kadın Doğum", konu: 100, soru: 400, konuK: "Speet", soruK: "Prime" }
    };

    const t345 = [
        { d: 'fizyoloji', g: 2 }, { d: 'patoloji', g: 3 }, { d: 'biyokimya', g: 1.5 },
        { d: 'pediatri', g: 3 }, { d: 'mikrobiyoloji', g: 2 }, { d: 'farmakoloji', g: 2 },
        { d: 'dahiliye', g: 3 }, { d: 'anatomi', g: 1 }, { d: 'kucukstajlar', g: 2.5 }, 
        { d: 'genelcerrahi', g: 3 }, { d: 'kadindogum', g: 2 }
    ];
    
    const sarmalAkil = [
        { tur: 1, seq: [{d:'dahiliye',g:6}, {d:'fizyoloji',g:4}, {d:'patoloji',g:4}, {d:'biyokimya',g:4}, {d:'pediatri',g:6}, {d:'mikrobiyoloji',g:4}, {d:'farmakoloji',g:4}, {d:'anatomi',g:4}, {d:'kucukstajlar',g:3}, {d:'genelcerrahi',g:3}, {d:'kadindogum',g:3}] },
        { tur: 2, seq: [{d:'fizyoloji',g:3}, {d:'patoloji',g:3}, {d:'biyokimya',g:3}, {d:'pediatri',g:4}, {d:'mikrobiyoloji',g:3}, {d:'farmakoloji',g:3}, {d:'dahiliye',g:4}, {d:'anatomi',g:3}, {d:'kucukstajlar',g:3}, {d:'genelcerrahi',g:3}, {d:'kadindogum',g:3}] },
        { tur: 3, seq: t345 }, { tur: 4, seq: t345 }, { tur: 5, seq: t345 }
    ];

    let calismaGunleri = [];
    let hedefGunler = { 1:{}, 2:{}, 3:{}, 4:{}, 5:{} }; // İstatistik için gün limitleri

    sarmalAkil.forEach(t => { 
        t.seq.forEach(s => { 
            hedefGunler[t.tur][planData[s.d].isim] = s.g;
            for(let i=1; i<=s.g; i++) { calismaGunleri.push({ tur: t.tur, ders: s.d, gun: i, toplamGun: s.g }); } 
        }); 
    });

    let globalGunVerisi = null; let globalSoruDersiKey = null; let globalDurum = "";
    let aktifTarih = new Date(new Date().setHours(0,0,0,0));
    let bugunSayaci = 0; 

    window.onload = () => { gunuHesaplaVeArayuzuCiz(); };

    function sekmeDegistir(sekme) {
        document.getElementById('sekme-plan').style.display = (sekme === 'plan') ? 'block' : 'none';
        document.getElementById('sekme-istatistik').style.display = (sekme === 'istatistik') ? 'block' : 'none';
        document.getElementById('tab-plan-btn').className = (sekme === 'plan') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-ist-btn').className = (sekme === 'istatistik') ? 'tab-btn active' : 'tab-btn';

        if(sekme === 'istatistik') istatistikleriYukle();
    }

    function bransModuluGoster() {
        const icerik = document.getElementById("brans-icerik");
        const ok = document.getElementById("brans-ok");
        if(icerik.style.display === "block") { icerik.style.display = "none"; ok.innerText = "▼"; } 
        else { icerik.style.display = "block"; ok.innerText = "▲"; }
    }

    function tarihDegistir(gunFarki) {
        aktifTarih.setDate(aktifTarih.getDate() + gunFarki);
        gunuHesaplaVeArayuzuCiz();
    }

    function gunuHesaplaVeArayuzuCiz() {
        const dun = new Date(aktifTarih); dun.setDate(dun.getDate() - 1);
        const yarin = new Date(aktifTarih); yarin.setDate(yarin.getDate() + 1);
        
        document.getElementById("y-dunku").innerText = dun.getDate();
        document.getElementById("y-bugunku").innerText = aktifTarih.getDate();
        document.getElementById("y-yarin").innerText = yarin.getDate();

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById("tarih-metni").innerText = aktifTarih.toLocaleDateString('tr-TR', options);

        const startDate = new Date(2026, 7, 28); 
        let currentDate = new Date(startDate);
        let isGunuSayaci = 0;
        let bugunDurum = "normal";

        while (currentDate <= aktifTarih) {
            let isWorkDay = true;
            let m = currentDate.getMonth(); let d = currentDate.getDate(); let y = currentDate.getFullYear();
            let gunHafta = currentDate.getDay(); 

            if (y === 2026 && m === 8 && (d === 11 || d === 12 || d === 13)) { isWorkDay = false; }
            else if (currentDate >= new Date(2026, 9, 4) && gunHafta === 0) { isWorkDay = false; }

            if (currentDate.getTime() === aktifTarih.getTime()) {
                if (!isWorkDay) bugunDurum = (gunHafta === 0 && currentDate >= new Date(2026, 9, 4)) ? "pazar_deneme" : "mola";
            }
            if (isWorkDay) isGunuSayaci++;
            currentDate.setDate(currentDate.getDate() + 1);
        }

        bugunSayaci = isGunuSayaci;
        globalDurum = bugunDurum;
        arayuzuUygula(isGunuSayaci, bugunDurum);
        firebaseDurumGetir(); 
    }

    function arayuzuUygula(isGunuSayaci, durum) {
        const kartDers = document.getElementById("aktif-ders-karti");
        const kartTatil = document.getElementById("tatil-karti");
        const denemeModulu = document.getElementById("deneme-modulu");

        document.getElementById("konu-check").checked = false;
        document.getElementById("soru-check").checked = false;
        document.getElementById("temel-check").checked = false;
        document.getElementById("klinik-check").checked = false;
        globalSoruDersiKey = null;

        if (durum === "mola") {
            kartDers.style.display = "none";
            kartTatil.style.display = "block";
            return;
        }

        kartTatil.style.display = "none";

        if (durum === "pazar_deneme") {
            kartDers.style.display = "block";
            document.getElementById("kart-ders-adi").innerText = "Pazar Deneme Günü";
            document.getElementById("kart-tur-gun").style.display = "none";
            document.getElementById("konu-modulu").style.display = "none";
            document.getElementById("soru-modulu").style.display = "none";
            denemeModulu.style.display = "block";
            return;
        }

        document.getElementById("kart-tur-gun").style.display = "inline-block";
        document.getElementById("konu-modulu").style.display = "block";
        document.getElementById("soru-modulu").style.display = "block";

        if (isGunuSayaci > calismaGunleri.length) {
            kartDers.style.display = "block";
            document.getElementById("kart-ders-adi").innerText = "🔥 Soru Kampı";
            document.getElementById("kart-tur-gun").innerText = "Son Düzlük";
            document.getElementById("konu-ders-isim").innerText = "Genel";
            document.getElementById("soru-ders-isim").innerText = "Karma";
            document.getElementById("konu-sayfa").innerText = "Eksik Kapatma / Spot Taraması";
            document.getElementById("soru-sayfa").innerText = "Karma Soru Bankası Çözümü";
            denemeModulu.style.display = "block";
            return;
        }

        kartDers.style.display = "block";
        const aktif = calismaGunleri[isGunuSayaci - 1];
        globalGunVerisi = aktif;
        const konuVeri = planData[aktif.ders];

        let oncekiDersKey = aktif.ders;
        let sarmalTur = sarmalAkil.find(t => t.tur === aktif.tur);
        let seqIdx = sarmalTur.seq.findIndex(s => s.d === aktif.ders);

        if (seqIdx > 0) { oncekiDersKey = sarmalTur.seq[seqIdx - 1].d; } 
        else if (aktif.tur > 1) {
            let oncekiTur = sarmalAkil.find(t => t.tur === aktif.tur - 1);
            oncekiDersKey = oncekiTur.seq[oncekiTur.seq.length - 1].d;
        }
        
        globalSoruDersiKey = oncekiDersKey;
        const soruVeri = planData[oncekiDersKey];

        document.getElementById("kart-ders-adi").innerText = `Çalışma Planı`;
        document.getElementById("kart-tur-gun").innerText = `${aktif.tur}. Tur (${aktif.gun}/${aktif.toplamGun} Gün)`;
        document.getElementById("konu-ders-isim").innerText = konuVeri.isim;
        
        if(aktif.tur === 1 && seqIdx === 0) document.getElementById("soru-ders-isim").innerText = konuVeri.isim;
        else document.getElementById("soru-ders-isim").innerText = soruVeri.isim;

        denemeModulu.style.display = (aktif.tur >= 5) ? "block" : "none";

        const gKonu = Math.ceil(konuVeri.konu / aktif.toplamGun);
        const gSoru = soruVeri.soru > 0 ? Math.ceil(soruVeri.soru / aktif.toplamGun) : 0;

        let kB = ((aktif.gun - 1) * gKonu) + 1; let kBi = aktif.gun * gKonu;
        if (kBi > konuVeri.konu || aktif.gun === aktif.toplamGun) kBi = konuVeri.konu;

        let sB = ((aktif.gun - 1) * gSoru) + 1; let sBi = aktif.gun * gSoru;
        if (sBi > soruVeri.soru || aktif.gun === aktif.toplamGun) sBi = soruVeri.soru;

        if (aktif.tur >= 3) {
            document.getElementById("konu-sayfa").innerText = `${konuVeri.konuK} (Hızlı spot/açık kapatma)`;
            document.getElementById("soru-sayfa").innerText = soruVeri.isim === "Anatomi" ? "Ayrı SB yok, Speet soruları." : `${soruVeri.soruK} - Elenmiş (Ort. Sf ${sB} - ${sBi})`;
        } else {
            document.getElementById("konu-sayfa").innerText = `${konuVeri.konuK} (Sayfa ${kB} - ${kBi})`;
            document.getElementById("soru-sayfa").innerText = soruVeri.isim === "Anatomi" ? "Ayrı SB yok, Speet içi okuma." : `${soruVeri.soruK} (Sayfa ${sB} - ${sBi})`;
        }
    }

    function firebaseDurumGetir() {
        const offset = aktifTarih.getTimezoneOffset();
        const seciliGunStr = new Date(aktifTarih.getTime() - (offset*60*1000)).toISOString().split('T')[0];
        db.ref('tus_gunluk_kayitlar/' + seciliGunStr).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                if(document.getElementById("konu-check")) document.getElementById("konu-check").checked = data.konu_bitti || false;
                if(document.getElementById("soru-check")) document.getElementById("soru-check").checked = data.soru_bitti || false;
                if(document.getElementById("temel-check")) document.getElementById("temel-check").checked = data.temel_deneme || data.son48_temel || false;
                if(document.getElementById("klinik-check")) document.getElementById("klinik-check").checked = data.klinik_deneme || data.son48_klinik || false;
            }
        });
    }

    function firebaseKaydet() {
        const offset = aktifTarih.getTimezoneOffset();
        const seciliGunStr = new Date(aktifTarih.getTime() - (offset*60*1000)).toISOString().split('T')[0];
        let kayit = { tarih: seciliGunStr, kayit_zamani: firebase.database.ServerValue.TIMESTAMP };

        if (globalDurum === "mola") { kayit.durum = "Mola Günü"; } 
        else if (globalDurum === "pazar_deneme") {
            kayit.durum = "Pazar Denemesi";
            kayit.temel_deneme = document.getElementById("temel-check").checked;
            kayit.klinik_deneme = document.getElementById("klinik-check").checked;
        } else {
            kayit.durum = "Sarmal Çalışma";
            kayit.tur = globalGunVerisi ? globalGunVerisi.tur : "Kamp";
            kayit.konu_dersi = globalGunVerisi ? planData[globalGunVerisi.ders].isim : "Soru Kampı";
            kayit.soru_dersi = globalSoruDersiKey ? planData[globalSoruDersiKey].isim : "Karma";
            kayit.konu_bitti = document.getElementById("konu-check").checked;
            kayit.soru_bitti = document.getElementById("soru-check").checked;
            if (globalGunVerisi && globalGunVerisi.tur >= 5) {
                kayit.son48_temel = document.getElementById("temel-check").checked;
                kayit.son48_klinik = document.getElementById("klinik-check").checked;
            }
        }
        db.ref('tus_gunluk_kayitlar/' + seciliGunStr).set(kayit).then(() => toastGoster("✅ Otomatik Kaydedildi"));
    }

    function bransDenemeKaydet() {
        const ders = document.getElementById("brans-ders").value;
        const dogru = parseFloat(document.getElementById("brans-dogru").value) || 0;
        const yanlis = parseFloat(document.getElementById("brans-yanlis").value) || 0;
        const net = dogru - (yanlis / 4);

        if(dogru === 0 && yanlis === 0) return alert("Doğru/yanlış sayısı girin!");

        const bugun = new Date().toISOString().split('T')[0];
        db.ref('tus_brans_denemeleri').push({
            tarih: bugun, ders: ders, dogru: dogru, yanlis: yanlis, net: net, timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            toastGoster("🎯 Net Başarıyla İşlendi");
            document.getElementById("brans-dogru").value = ""; document.getElementById("brans-yanlis").value = "";
            bransModuluGoster(); istatistikleriYukle();
        });
    }

    function istatistikleriYukle() {
        // Mevcut Durum Özeti 
        if(globalGunVerisi) {
            document.getElementById("ist-mevcut-tur").innerText = `${globalGunVerisi.tur}. Tur`;
            document.getElementById("ist-mevcut-gun").innerText = `Çalışılan: ${bugunSayaci} Gün`;
        } else {
            document.getElementById("ist-mevcut-tur").innerText = "Kamp";
            document.getElementById("ist-mevcut-gun").innerText = "Sona Yaklaşıldı";
        }

        // TAMAMLANAN GÖREVLER (TIK TIK LİSTE MANTIĞI)
        db.ref('tus_gunluk_kayitlar').once('value').then((snapshot) => {
            const yapilanlar = {};
            for(let t=1; t<=5; t++) {
                yapilanlar[t] = {};
                for(let key in planData) { yapilanlar[t][planData[key].isim] = { konu: 0, soru: 0 }; }
            }

            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    if (data.durum === "Sarmal Çalışma" && data.tur) {
                        if(data.konu_bitti && data.konu_dersi && yapilanlar[data.tur][data.konu_dersi]) yapilanlar[data.tur][data.konu_dersi].konu++;
                        if(data.soru_bitti && data.soru_dersi && yapilanlar[data.tur][data.soru_dersi]) yapilanlar[data.tur][data.soru_dersi].soru++;
                    }
                });
            }

            let htmlListe = '';
            for(let t=1; t<=5; t++) {
                let turIcerik = '';
                for(let key in planData) {
                    const dersAd = planData[key].isim;
                    const hedefGun = hedefGunler[t][dersAd];
                    if(hedefGun) {
                        const konuBittiMi = yapilanlar[t][dersAd].konu >= hedefGun;
                        const soruBittiMi = yapilanlar[t][dersAd].soru >= hedefGun;

                        if (konuBittiMi || soruBittiMi) {
                            turIcerik += `<div style="font-size:13px; color:#e0e0e0; border-bottom:1px solid #333; padding:8px 0; display:flex; align-items:center;">`;
                            if (dersAd === "Anatomi") {
                                if (konuBittiMi) turIcerik += `✅ <b>${dersAd}</b> &nbsp;<span style="color:#a0a0a0;">(Konu Bitti)</span>`;
                            } else {
                                if (konuBittiMi && soruBittiMi) {
                                    turIcerik += `✅✅ <b>${dersAd}</b> &nbsp;<span style="color:var(--success); font-weight:bold;">(Konu + Soru Bitti)</span>`;
                                } else if (konuBittiMi) {
                                    turIcerik += `✅ <b>${dersAd}</b> &nbsp;<span style="color:var(--primary);">(Sadece Konu)</span>`;
                                } else if (soruBittiMi) {
                                    turIcerik += `✅ <b>${dersAd}</b> &nbsp;<span style="color:var(--secondary);">(Sadece Soru)</span>`;
                                }
                            }
                            turIcerik += `</div>`;
                        }
                    }
                }
                if(turIcerik !== '') {
                    htmlListe += `<h3 style="color:var(--primary); font-size:14px; margin-top:15px; margin-bottom:5px; text-transform:uppercase;">${t}. Tur Bitenler</h3>`;
                    htmlListe += turIcerik;
                }
            }

            if(htmlListe === '') htmlListe = '<div style="text-align:center; color:#888; font-size:13px; margin-top:10px;">Henüz tüm günleri tamamlanmış bir ders yok. İlk tiki atmaya çok yakınsın!</div>';
            document.getElementById("ist-tamamlanan-liste").innerHTML = htmlListe;
        });

        // Branş Deneme Analizi
        db.ref('tus_brans_denemeleri').once('value').then((snapshot) => {
            if (!snapshot.exists()) {
                document.getElementById("analiz-icerik").innerText = "Henüz girilmiş bir branş denemesi yok.";
                return;
            }
            const dersVerileri = {};
            snapshot.forEach((child) => {
                const data = child.val();
                if(!dersVerileri[data.ders]) dersVerileri[data.ders] = { toplamNet: 0, count: 0, maxNet: -99 };
                dersVerileri[data.ders].toplamNet += data.net;
                dersVerileri[data.ders].count++;
                if(data.net > dersVerileri[data.ders].maxNet) dersVerileri[data.ders].maxNet = data.net;
            });

            let html = `<table class="analiz-tablo"><tr><th>Ders</th><th>Ort. Net</th><th>Max</th><th>Adet</th></tr>`;
            for (const [ders, stat] of Object.entries(dersVerileri)) {
                let ortalama = (stat.toplamNet / stat.count).toFixed(2);
                html += `<tr>
                            <td>${ders}</td>
                            <td style="color:var(--success); font-weight:bold;">${ortalama}</td>
                            <td>${stat.maxNet.toFixed(2)}</td>
                            <td>${stat.count}</td>
                         </tr>`;
            }
            html += `</table>`;
            document.getElementById("analiz-icerik").innerHTML = html;
        });
    }

    function toastGoster(mesaj) {
        const toast = document.getElementById("toast");
        toast.innerText = mesaj; toast.style.opacity = "1";
        setTimeout(() => { toast.style.opacity = "0"; }, 2000);
    }
</script>
