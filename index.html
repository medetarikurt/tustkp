<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUS Çalışma Takip Sistemi</title>
    
    <!-- Firebase SDK (v8 Realtime DB Uyumlu) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --primary-variant: #3700b3;
            --secondary: #03dac6;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --success: #4caf50;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { background-color: var(--surface); padding: 24px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #252525; color: #fff; outline: none; font-size: 15px; }
        select:focus { border-color: var(--primary); }

        .hedef-karti { background: #262626; border-left: 4px solid var(--secondary); padding: 16px; border-radius: 8px; margin-top: 20px; }
        .hedef-baslik { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .hedef-baslik h2 { font-size: 18px; color: #fff; }
        .badge { background: var(--primary-variant); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        
        .gorev-item { margin-bottom: 12px; background: #303030; padding: 12px; border-radius: 8px; }
        .gorev-item strong { color: var(--secondary); display: block; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; }
        .sayfa-bilgisi { font-size: 15px; margin-bottom: 10px; color: #fff; }
        
        .checkbox-container { display: flex; align-items: center; cursor: pointer; user-select: none; font-size: 14px; }
        .checkbox-container input { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
        
        .btn-kaydet { width: 100%; background-color: var(--primary); color: #000; font-weight: 700; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 18px; transition: opacity 0.2s; }
        .btn-kaydet:hover { opacity: 0.9; }
        
        #mesaj { text-align: center; margin-top: 14px; font-size: 13px; display: none; }
        .mesaj-basarili { color: var(--success); }
    </style>
</head>
<body>

<div class="container">
    <h1>TUS Hedef Takibi</h1>

    <div class="form-group">
        <label>Tekrar Turu</label>
        <select id="tur-secim" onchange="gunSecenekleriniDoldur()">
            <option value="1">1. Tur (45 Gün)</option>
            <option value="2">2. Tur (35 Gün)</option>
            <option value="3">3. Tur (25 Gün)</option>
            <option value="4">4. Tur (25 Gün)</option>
            <option value="5">5. Tur (25 Gün)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ders</label>
        <select id="ders-secim" onchange="gunSecenekleriniDoldur()">
            <!-- JS ile dinamik dolar -->
        </select>
    </div>

    <div class="form-group">
        <label>Tur İçindeki Gün</label>
        <select id="gun-secim" onchange="guncelleArayuz()">
            <!-- JS ile dinamik dolar -->
        </select>
    </div>

    <div class="hedef-karti">
        <div class="hedef-baslik">
            <h2 id="kart-ders-adi">Ders</h2>
            <span id="kart-tur-gun" class="badge">1. Tur - 1/X Gün</span>
        </div>

        <div class="gorev-item">
            <strong>📖 Konu Hedefi</strong>
            <div id="konu-sayfa" class="sayfa-bilgisi">Kaynak (Sayfa X - Y)</div>
            <label class="checkbox-container">
                <input type="checkbox" id="konu-check"> Hedefi Tamamladım
            </label>
        </div>

        <div class="gorev-item">
            <strong>🎯 Soru Hedefi</strong>
            <div id="soru-sayfa" class="sayfa-bilgisi">Kaynak (Sayfa X - Y)</div>
            <label class="checkbox-container">
                <input type="checkbox" id="soru-check"> Hedefi Tamamladım
            </label>
        </div>
        
        <div class="gorev-item" id="deneme-modulu" style="display: none; border-left: 3px solid #ff9800;">
            <strong>🔥 Son 48 Gün Seri Deneme</strong>
            <label class="checkbox-container" style="margin-bottom: 8px;">
                <input type="checkbox" id="temel-check"> 1 Temel Bilimler Denemesi (100 Soru)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="klinik-check"> 1 Klinik Bilimler Denemesi (100 Soru)
            </label>
        </div>
    </div>

    <button class="btn-kaydet" onclick="firebaseKaydet()">Günü Kaydet</button>
    <div id="mesaj"></div>
</div>

<script>
    // Kullanıcıya özel Firebase Konfigürasyonu
    const firebaseConfig = {
        apiKey: "AIzaSyCaDwYAGYgMHLmO3jypXF_SscN1Lze2EHg",
        authDomain: "tustkp.firebaseapp.com",
        databaseURL: "https://tustkp-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "tustkp",
        storageBucket: "tustkp.firebasestorage.app",
        messagingSenderId: "698391461184",
        appId: "1:698391461184:web:a990d5b57b6d7ad8f7cea5",
        measurementId: "G-K4BTXL7FLB"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 6.470 sayfalık müfredat envanteri ve gün dağılımları
    const planData = {
        dahiliye: { isim: "Dahiliye", konuKaynak: "BBB Tıp Ak.", soruKaynak: "Prime", konuSayfa: 450, soruSayfa: 750, turlar: {1:6, 2:4, 3:3, 4:3, 5:3} },
        pediatri: { isim: "Pediatri", konuKaynak: "Speet", soruKaynak: "Ahmet Erkek", konuSayfa: 200, soruSayfa: 450, turlar: {1:6, 2:4, 3:3, 4:3, 5:3} },
        fizyoloji: { isim: "Fizyoloji", konuKaynak: "Speet", soruKaynak: "Prime", konuSayfa: 100, soruSayfa: 400, turlar: {1:4, 2:3, 3:2, 4:2, 5:2} },
        patoloji: { isim: "Patoloji", konuKaynak: "Speet", soruKaynak: "SST", konuSayfa: 100, soruSayfa: 450, turlar: {1:4, 2:3, 3:3, 4:3, 5:3} },
        biyokimya: { isim: "Biyokimya", konuKaynak: "Tıp Ak.", soruKaynak: "Tıp Ak.", konuSayfa: 200, soruSayfa: 200, turlar: {1:4, 2:3, 3:1.5, 4:1.5, 5:1.5} },
        mikrobiyoloji: { isim: "Mikrobiyoloji", konuKaynak: "Tıp Ak.", soruKaynak: "Prime", konuSayfa: 250, soruSayfa: 400, turlar: {1:4, 2:3, 3:2, 4:2, 5:2} },
        farmakoloji: { isim: "Farmakoloji", konuKaynak: "Speet", soruKaynak: "Prime", konuSayfa: 100, soruSayfa: 400, turlar: {1:4, 2:3, 3:2, 4:2, 5:2} },
        anatomi: { isim: "Anatomi", konuKaynak: "Speet", soruKaynak: "Yok", konuSayfa: 100, soruSayfa: 0, turlar: {1:4, 2:3, 3:1, 4:1, 5:1} },
        kucukstajlar: { isim: "Küçük Stajlar", konuKaynak: "Speet", soruKaynak: "Prime", konuSayfa: 170, soruSayfa: 400, turlar: {1:3, 2:3, 3:2.5, 4:2.5, 5:2.5} },
        genelcerrahi: { isim: "Genel Cerrahi", konuKaynak: "Ahmet Erkek", soruKaynak: "Ahmet Erkek", konuSayfa: 400, soruSayfa: 450, turlar: {1:3, 2:3, 3:3, 4:3, 5:3} },
        kadindogum: { isim: "Kadın Doğum", konuKaynak: "Speet", soruKaynak: "Prime", konuSayfa: 100, soruSayfa: 400, turlar: {1:3, 2:3, 3:2, 4:2, 5:2} }
    };

    window.onload = () => {
        dersSecenekleriniDoldur();
        gunSecenekleriniDoldur();
    };

    function dersSecenekleriniDoldur() {
        const dersSelect = document.getElementById("ders-secim");
        dersSelect.innerHTML = "";
        for (const [key, data] of Object.entries(planData)) {
            let opt = document.createElement("option");
            opt.value = key;
            opt.innerText = data.isim;
            dersSelect.appendChild(opt);
        }
    }

    function gunSecenekleriniDoldur() {
        const tur = parseInt(document.getElementById("tur-secim").value);
        const dersKey = document.getElementById("ders-secim").value;
        const gunSelect = document.getElementById("gun-secim");
        
        const toplamGun = planData[dersKey].turlar[tur];
        const tavanGun = Math.ceil(toplamGun);
        
        gunSelect.innerHTML = "";
        for (let i = 1; i <= tavanGun; i++) {
            let opt = document.createElement("option");
            opt.value = i;
            opt.innerText = `${i}. Gün`;
            gunSelect.appendChild(opt);
        }
        
        guncelleArayuz();
    }

    function guncelleArayuz() {
        const tur = parseInt(document.getElementById("tur-secim").value);
        const dersKey = document.getElementById("ders-secim").value;
        const aktifGun = parseInt(document.getElementById("gun-secim").value);
        
        const ders = planData[dersKey];
        const toplamGun = ders.turlar[tur];
        
        document.getElementById("kart-ders-adi").innerText = ders.isim;
        document.getElementById("kart-tur-gun").innerText = `${tur}. Tur (${aktifGun} / ${toplamGun} Gün)`;

        // Son 48 Gün kuralı (5. Tur seçildiğinde deneme onay kutuları açılır)
        const denemeModulu = document.getElementById("deneme-modulu");
        denemeModulu.style.display = (tur === 5) ? "block" : "none";

        // Günlük sayfa kotalarının hesaplanması
        const gunlukKonu = Math.ceil(ders.konuSayfa / toplamGun);
        const gunlukSoru = ders.soruSayfa > 0 ? Math.ceil(ders.soruSayfa / toplamGun) : 0;

        let kBaslangic = ((aktifGun - 1) * gunlukKonu) + 1;
        let kBitis = aktifGun * gunlukKonu;
        if (kBitis > ders.konuSayfa || aktifGun === Math.ceil(toplamGun)) kBitis = ders.konuSayfa;

        let sBaslangic = ((aktifGun - 1) * gunlukSoru) + 1;
        let sBitis = aktifGun * gunlukSoru;
        if (sBitis > ders.soruSayfa || aktifGun === Math.ceil(toplamGun)) sBitis = ders.soruSayfa;

        // Bilgilerin karta aktarılması
        if (tur >= 3) {
            document.getElementById("konu-sayfa").innerText = `${ders.konuKaynak} (Hızlı spot/açık kapatma)`;
            document.getElementById("soru-sayfa").innerText = ders.isim === "Anatomi" 
                ? "Ayrı SB yok, Speet soruları/spotları."
                : `${ders.soruKaynak} - Elenmiş Sorular (Ort. Sayfa ${sBaslangic} - ${sBitis})`;
        } else {
            document.getElementById("konu-sayfa").innerText = `${ders.konuKaynak} (Sayfa ${kBaslangic} - ${kBitis})`;
            document.getElementById("soru-sayfa").innerText = ders.isim === "Anatomi" 
                ? "Ayrı SB yok, Speet içi okuma."
                : `${ders.soruKaynak} (Sayfa ${sBaslangic} - ${sBitis})`;
        }
        
        document.getElementById("konu-check").checked = false;
        document.getElementById("soru-check").checked = false;
        document.getElementById("temel-check").checked = false;
        document.getElementById("klinik-check").checked = false;
    }

    function firebaseKaydet() {
        const tur = document.getElementById("tur-secim").value;
        const dersKey = document.getElementById("ders-secim").value;
        const dersIsim = planData[dersKey].isim;
        const gun = document.getElementById("gun-secim").value;
        const toplamGun = planData[dersKey].turlar[tur];
        
        const konuTamam = document.getElementById("konu-check").checked;
        const soruTamam = document.getElementById("soru-check").checked;
        const temelTamam = document.getElementById("temel-check").checked;
        const klinikTamam = document.getElementById("klinik-check").checked;
        
        const bugun = new Date().toISOString().split('T')[0];
        
        const kayitVerisi = {
            tarih: bugun,
            tur: parseInt(tur),
            ders: dersIsim,
            kacinci_gun: `${gun}/${toplamGun}`,
            konu_bitti: konuTamam,
            soru_bitti: soruTamam,
            son48_temel_deneme: tur == 5 ? temelTamam : "Uygulanmadi",
            son48_klinik_deneme: tur == 5 ? klinikTamam : "Uygulanmadi",
            kayit_zamani: firebase.database.ServerValue.TIMESTAMP
        };

        db.ref('tus_gunluk_kayitlar/' + bugun).set(kayitVerisi)
        .then(() => {
            const mesaj = document.getElementById("mesaj");
            mesaj.innerText = "Kayıt Firebase'e başarıyla işlendi! ✅";
            mesaj.className = "mesaj-basarili";
            mesaj.style.display = "block";
            setTimeout(() => { mesaj.style.display = "none"; }, 4000);
        })
        .catch((error) => {
            console.error("Firebase Hatası:", error);
            alert("Kayıt başarısız oldu. Realtime Database izinlerini kontrol edin.");
        });
    }
</script>
</body>
</html>
