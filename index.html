<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TUS Takip & Sarmal Analiz</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            /* Gece nöbeti sonrası masa lambası ışığı hissi: koyu lacivert zemin + sıcak altın vurgu */
            --bg: #0a0e17;
            --surface: #131927;
            --surface-card: #1a2133;
            --surface-nested: #212a42;
            --surface-hover: #2a3550;
            --border: #2d3650;

            --primary: #e8b55f;
            --primary-variant: #b8863a;
            --primary-rgb: 232, 181, 95;

            --secondary: #4fd1c5;
            --secondary-rgb: 79, 209, 197;

            --text: #e8eaf0;
            --text-muted: #8b93a7;

            --success: #4ade80;
            --success-rgb: 74, 222, 128;

            --warning: #fb923c;
            --warning-rgb: 251, 146, 60;

            --danger: #f87171;
            --danger-rgb: 248, 113, 113;

            --info: #60a5fa;

            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            overscroll-behavior-y: contain;
        }

        .container { background-color: var(--surface); padding: 20px; border-radius: 14px; width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 15px; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }

        .countdown-banner { text-align: center; background: linear-gradient(135deg, var(--primary-variant), var(--primary)); color: #1a1206; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 14px; margin-bottom: 15px; letter-spacing: 0.3px; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; background: transparent; color: var(--text-muted); border: none; padding: 12px 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .tab-btn:active { opacity: 0.6; }

        .takvim-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .nav-ok { background: transparent; color: var(--text-muted); border: none; font-size: 24px; cursor: pointer; padding: 8px 15px; transition: 0.2s; }
        .nav-ok:hover { color: #fff; }
        .nav-ok:active { opacity: 0.5; transform: scale(0.92); }
        
        .yuvarlaklar { display: flex; gap: 12px; align-items: center; }
        .yuvarlak { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-nested); font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text-muted); transition: 0.25s; }
        .yuvarlak:hover { background: var(--surface-hover); }
        .yuvarlak:active { transform: scale(0.92); }
        .yuvarlak.aktif { background: var(--primary); color: #1a1206; transform: scale(1.08); box-shadow: 0 0 12px rgba(var(--primary-rgb), 0.45); }

        .tarih-alt-yazi { text-align: center; color: var(--secondary); font-size: 13px; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

        .hedef-karti { background: var(--surface-card); border-left: 4px solid var(--secondary); padding: 16px; border-radius: 10px; margin-bottom: 15px; }
        .tatil-karti { border-left-color: var(--warning); display: none; }
        
        .nobet-banner { background: rgba(var(--danger-rgb), 0.15); border: 1px solid var(--danger); color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 12px; display: none; }
        .nobet-banner span { color: var(--danger); }

        .hedef-baslik { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .hedef-baslik h2 { font-size: 18px; color: #fff; }
        .badge { background: var(--primary-variant); color: #1a1206; padding: 4px 9px; border-radius: 5px; font-size: 12px; font-weight: 700; }
        
        .gorev-item { margin-bottom: 12px; background: var(--surface-nested); padding: 12px; border-radius: 10px; }
        .gorev-item strong { display: block; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; }
        .sayfa-bilgisi { font-size: 14px; margin-bottom: 8px; color: #fff; }

        .progress-bar-container { background: var(--bg); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar-fill { background: var(--primary); height: 100%; border-radius: 6px; transition: width 0.4s ease; width: 0%; }
        #soru-modulu .progress-bar-fill { background: var(--secondary); }
        
        .checkbox-container { display: flex; align-items: center; cursor: pointer; user-select: none; font-size: 14px; color: #ccc; padding: 4px 0; }
        .checkbox-container input { margin-right: 10px; width: 20px; height: 20px; accent-color: var(--success); cursor: pointer; }
        
        .not-panosu { background: var(--surface-card); border-left: 4px solid var(--info); padding: 14px; border-radius: 10px; margin-bottom: 15px; }
        .not-panosu h2 { font-size: 15px; color: #fff; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .eksik-panosu { border-left-color: var(--danger); }
        .not-status { font-size: 11px; color: var(--success); font-weight: normal; }
        .not-textarea { width: 100%; height: 80px; background: var(--bg); color: #e0e0e0; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 16px; resize: vertical; outline: none; transition: 0.3s; font-family: inherit; }
        .not-textarea:focus { border-color: var(--info); }
        .eksik-panosu .not-textarea:focus { border-color: var(--danger); }
        .not-textarea::placeholder { color: #5f6880; font-size: 13px; }

        .btn-acilir { width: 100%; background: var(--surface-nested); color: #fff; border: 1px solid var(--border); padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .btn-acilir:hover { background: var(--surface-hover); }
        .btn-acilir:active { transform: scale(0.98); }
        
        .brans-modulu-icerik { display: none; background: var(--surface-card); padding: 15px; border-radius: 10px; margin-top: 8px; border-left: 3px solid var(--primary); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 11px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-nested); color: #fff; outline: none; font-size: 16px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        .btn-kaydet { width: 100%; background: var(--primary); color: #1a1206; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 15px; transition: 0.2s; }
        .btn-kaydet:active { transform: scale(0.98); opacity: 0.9; }

        .stats-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .stats-row .istatistik-kutu { flex: 1; margin-bottom: 0; }
        .istat
